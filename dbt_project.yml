name: books_shop_dbt
version: 1.0.0
config-version: 2
profile: books_shop_dbt

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: target
clean-targets:
  - target
  - dbt_packages

vars:
  funnel_lookback_days: 30

on-run-start:
  - "{{ log('Starting books-shop-dbt run', info=True) }}"

models:
  books_shop_dbt:
    staging:
      +group: staging
      +materialized: view
      +tags: ["staging"]
      books_shop:
        +schema: staging
      rudderstack:
        +schema: staging
        stg_rudderstack__events:
          +materialized: incremental
          +unique_key: event_id
          +incremental_strategy: merge
    intermediate:
      +group: intermediate
      +materialized: table
      +schema: intermediate
      +tags: ["intermediate"]
    marts:
      +group: marts
      +materialized: table
      +tags: ["marts"]
      core:
        +schema: marts
        +tags: ["core", "funnel"]
      marketing:
        +schema: marts
        +tags: ["marketing", "funnel"]

seeds:
  books_shop_dbt:
    +schema: raw
    +tags: ["raw"]

snapshots:
  books_shop_dbt:
    +target_schema: snapshots
    +tags: ["snapshots"]
